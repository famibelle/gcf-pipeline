[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcf-pipeline"
version = "1.0.0"
description = "Conversion des transcriptions Whisper-haïtien en corpus ASR créole guadeloupéen (GEREC-2)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["asr", "creole", "guadeloupe", "gcf", "low-resource", "whisper", "byt5"]
dependencies = [
    "datasets>=2.18.0",
    "transformers>=4.40.0",
    "torch>=2.1.0",
    "accelerate>=0.29.0",
    "sentencepiece>=0.2.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
align = ["simalign>=0.4"]
lm = ["kenlm>=0.2.0"]
asr = ["faster-whisper>=1.0.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
